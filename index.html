<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User intake walkthrough, no typing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#E9EBEF;--grid:#DCDFE6;--ink:#131720;--muted:#69707E;--hair:#C9CED8;--paper:#FFFFFF;
  --brand:#2F6B57;--brand-soft:#E7F0EC;
  --ui:'Instrument Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--ui);color:var(--ink);-webkit-font-smoothing:antialiased;
  background:var(--canvas);}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 22px;background:rgba(255,255,255,.85);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:40}
.mark{font-weight:700;font-size:15px;letter-spacing:-.01em}
.mark span{color:var(--muted);font-weight:400}
.tabs{display:flex;gap:2px;background:var(--canvas);border-radius:8px;padding:3px}
.tabs button{font:inherit;font-size:13px;font-weight:500;border:none;background:transparent;color:var(--muted);padding:6px 14px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.spacer{flex:1}
.swatches{display:flex;align-items:center;gap:7px}
.swatches p{font-size:12.5px;color:var(--muted);margin:0 4px 0 0}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}

.stage{display:flex;flex-direction:column;align-items:center;padding:56px 22px 64px;gap:22px;min-height:100vh;justify-content:center}
.device{width:352px;height:716px;background:#0B0D11;border-radius:46px;padding:11px;position:relative;flex:none;
  box-shadow:0 32px 70px -30px rgba(16,20,28,.55),0 0 0 1px rgba(0,0,0,.14)}
.notch{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:100px;height:27px;background:#0B0D11;border-radius:14px;z-index:7}
.viewport{width:100%;height:100%;background:var(--paper);border-radius:36px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{display:flex;justify-content:space-between;padding:14px 26px 4px;font-size:12.5px;font-weight:600;position:relative;z-index:4}
.status em{font-style:normal;letter-spacing:.04em}
.appbar{display:flex;align-items:center;gap:8px;padding:14px 22px 6px}
.logo{width:20px;height:20px;border-radius:6px;background:var(--brand)}
.wordmark{font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.screen{flex:1;padding:6px 20px 20px;display:flex;flex-direction:column;overflow:hidden}
.screen.in-fwd{animation:inFwd .4s cubic-bezier(.32,.72,0,1) both}
.screen.in-back{animation:inBack .4s cubic-bezier(.32,.72,0,1) both}
.screen.in-fade{animation:inFade .32s ease both}
@keyframes inFwd{from{transform:translate3d(28px,0,0);opacity:0}to{transform:none;opacity:1}}
@keyframes inBack{from{transform:translate3d(-28px,0,0);opacity:0}to{transform:none;opacity:1}}
@keyframes inFade{from{opacity:0}to{opacity:1}}

/* outgoing screen is cloned here so the two overlap instead of flashing blank */
.ghost{position:absolute;pointer-events:none;z-index:3;display:flex;flex-direction:column;
  overflow:hidden;background:var(--paper);will-change:transform,opacity}
.ghost.out-fwd{animation:outFwd .4s cubic-bezier(.32,.72,0,1) forwards}
.ghost.out-back{animation:outBack .4s cubic-bezier(.32,.72,0,1) forwards}
@keyframes outFwd{from{transform:none;opacity:1}to{transform:translate3d(-28px,0,0);opacity:0}}
@keyframes outBack{from{transform:none;opacity:1}to{transform:translate3d(28px,0,0);opacity:0}}
#chrome{transition:opacity .3s ease}

h2.t{font-size:23px;line-height:1.12;letter-spacing:-.025em;font-weight:700;margin:6px 0 8px}
p.s{font-size:13px;line-height:1.5;color:var(--muted);margin:0 0 12px}
.grow{flex:1;min-height:10px}
.btn{font-size:15px;font-weight:600;width:100%;border-radius:12px;background:var(--brand);color:#fff;padding:14px;text-align:center}
.btn.dark{background:#000}
.legal{font-size:9.5px;line-height:1.5;color:#8A909C;margin:10px 0 0}
.legal b{color:var(--ink);font-weight:500}
.legal u{text-decoration-color:#B9BEC8}
.card{border:1px solid var(--hair);border-radius:14px;padding:14px;margin-bottom:10px}
.card.tint{background:var(--brand-soft);border-color:transparent}
.who{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.av{border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
.who .av{width:40px;height:40px;font-size:13.5px}
.who h3{margin:0;font-size:16px;letter-spacing:-.01em}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #EEF0F3;font-size:12.5px}
.kv:first-of-type{border-top:none}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;background:var(--brand-soft);color:var(--brand);border-radius:20px;padding:5px 11px;align-self:flex-start}
.pill .dotp{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.live .dotp{animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--brand);background:var(--brand-soft);border-radius:12px;margin-bottom:10px}
.boxc{width:19px;height:19px;border-radius:5px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;margin-top:1px}
.opt p{margin:0;font-size:12.5px;font-weight:600;line-height:1.35}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px}
.slots{display:grid;gap:7px}
.slot{font-size:13.5px;padding:11px 14px;border:1px solid var(--hair);border-radius:11px;background:var(--paper);display:flex;justify-content:space-between}
.slot.on{border-color:var(--brand);background:var(--brand-soft);font-weight:600}
.spin{width:36px;height:36px;border-radius:50%;border:2.5px solid #E7E9ED;border-top-color:var(--brand);animation:sp 1s linear infinite;margin:0 auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}
.tick{width:54px;height:54px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px}
.center{text-align:center}

/* search */
.searchbar{display:flex;align-items:center;gap:8px;background:#F1F2F5;border-radius:11px;padding:9px 12px;font-size:13px;color:var(--muted);margin-bottom:10px}
.fgroup{margin-bottom:9px}
.flabel{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#98A0AD;margin:0 0 5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;border:1px solid var(--hair);border-radius:20px;padding:5px 10px;background:var(--paper);color:#5C6472;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.resultline{font-size:11px;color:var(--muted);margin:8px 0 8px;font-weight:600}
.plist{overflow:hidden}
.prov{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--hair);border-radius:12px;margin-bottom:7px}
.prov .av{width:36px;height:36px;font-size:12px;flex:none}
.prov h3{margin:0;font-size:13.5px}
.prov p{margin:1px 0 0;font-size:11px;color:var(--muted);line-height:1.35}
.prov .next{font-size:10.5px;color:var(--brand);font-weight:600;margin-top:2px}
.tagline{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.tag{font-size:9px;font-weight:600;background:#F1F2F5;color:#5C6472;border-radius:5px;padding:2px 5px}

/* profile */
.prohead{display:flex;gap:12px;align-items:center;margin:2px 0 10px}
.prohead .av{width:54px;height:54px;font-size:17px;flex:none}
.prohead h3{margin:0;font-size:18px;letter-spacing:-.015em}
.prohead p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.prohead .stars{font-size:11px;color:var(--brand);font-weight:600;margin-top:3px}
.bio{font-size:12px;line-height:1.5;color:#3E4653;margin:0 0 8px}
.bio b{font-weight:600;color:var(--ink)}
.metarow{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-bottom:9px;flex-wrap:wrap}
.metarow b{display:block;color:var(--ink);font-size:12px;font-weight:600}

/* home */
.home{position:absolute;inset:0;border-radius:36px;padding:52px 22px 16px;display:flex;flex-direction:column;
  background:radial-gradient(120% 80% at 30% 0%, #4B5A73 0%, #2A3446 45%, #161C26 100%)}
.homeclock{color:#fff;text-align:center;margin-bottom:24px}
.homeclock b{display:block;font-size:18px;font-weight:600;opacity:.92}
.homeclock i{display:block;font-style:normal;font-size:58px;font-weight:600;letter-spacing:-.035em;line-height:1.05}
.homegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 16px}
.appcell{text-align:center}
.appicon{aspect-ratio:1;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.28)}
.applabel{color:#fff;font-size:9.5px;margin-top:5px;text-shadow:0 1px 3px rgba(0,0,0,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tipzone{flex:1;min-height:60px}
.dock{background:rgba(255,255,255,.16);backdrop-filter:blur(10px);border-radius:24px;padding:11px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.dock .appicon{border-radius:15px}

/* apple pay */
.apsheet{position:absolute;left:0;right:0;bottom:0;background:#F7F7F9;border-radius:22px 22px 36px 36px;padding:15px 18px 22px;
  box-shadow:0 -18px 50px rgba(0,0,0,.28);animation:rise .4s cubic-bezier(.2,.8,.3,1);z-index:5}
@keyframes rise{from{transform:translateY(60%);opacity:.4}to{transform:none;opacity:1}}
.aphead{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:600;margin-bottom:11px}
.apcard{background:#fff;border-radius:12px;padding:10px 12px;font-size:12px;display:flex;justify-content:space-between;margin-bottom:7px;align-items:center}
.apcard small{display:block;color:var(--muted);font-size:10.5px}
.apvisa{width:34px;height:22px;border-radius:4px;background:linear-gradient(135deg,#1A1F71,#2B3AA0);color:#fff;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center}
.aptotal{display:flex;justify-content:space-between;font-size:15px;font-weight:700;padding:10px 2px 12px;border-top:1px solid #E3E3E8;margin-top:3px}
.faceid{text-align:center;padding:4px 0 2px}
.faceid .fi{width:48px;height:48px;border-radius:13px;border:2.5px solid #111;margin:0 auto 8px;animation:scan 1.8s ease-in-out infinite}
@keyframes scan{0%,100%{opacity:1}50%{opacity:.35}}
.faceid p{margin:0;font-size:13px;font-weight:600}
.faceid small{color:var(--muted);font-size:11px}
.dblclick{position:absolute;right:-11px;top:128px;width:4px;height:64px;background:#3A3F47;border-radius:0 3px 3px 0}
.dbllabel{position:absolute;right:8px;top:96px;background:var(--ink);color:#fff;font-size:10px;font-weight:600;padding:4px 8px;border-radius:14px;z-index:9}

/* tap + tooltip */
.tapdot{position:absolute;z-index:8;pointer-events:none;transform:translate(-50%,-50%)}
.tapdot i{display:block;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.45);border:2px solid rgba(255,255,255,.95);
  box-shadow:0 0 0 2px rgba(19,23,32,.28),0 6px 18px rgba(0,0,0,.35);animation:press .6s ease-out}
@keyframes press{0%{transform:scale(1.8);opacity:0}50%{transform:scale(.85);opacity:1}100%{transform:scale(1);opacity:.9}}
.tip.out{opacity:0;transition:opacity .18s ease}
.tip{position:absolute;z-index:9;background:var(--ink);color:#fff;font-size:12.5px;line-height:1.5;
  padding:11px 14px;border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.32);animation:pop .3s cubic-bezier(.33,.9,.35,1)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.controls button{font:inherit;font-size:13px;font-weight:500;background:var(--paper);border:1px solid var(--hair);border-radius:8px;padding:8px 14px;cursor:pointer}
.controls button:disabled{opacity:.4;cursor:default}
.controls button.play{background:var(--ink);color:#fff;border-color:var(--ink);min-width:82px}
.stepn{font-size:12.5px;color:var(--muted);font-weight:600}
.dots{display:flex;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--hair);display:block}
.dots i.on{background:var(--ink)}

/* insights */
.panel{max-width:1000px;margin:0 auto;padding:38px 22px 90px}
.panel h1{font-size:30px;letter-spacing:-.028em;margin:0 0 14px}
.livebar{display:flex;flex-wrap:wrap;gap:26px;align-items:center;background:var(--brand-soft);border:1px solid rgba(47,107,87,.28);
  border-radius:13px;padding:14px 18px;margin-bottom:22px}
.livetag{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.02em}
.livetag i{width:8px;height:8px;border-radius:50%;background:var(--brand);animation:blink 1.4s ease-in-out infinite}
.livebar .m b{display:block;font-size:21px;letter-spacing:-.025em;font-variant-numeric:tabular-nums;color:var(--brand)}
.livebar .m span{font-size:12px;color:#3F6659}
.summary{background:var(--paper);border:1px solid var(--hair);border-radius:13px;padding:18px 20px;margin-bottom:24px}
.summary h2{font-size:16px;margin:0 0 12px;letter-spacing:-.01em}
.summary ul{margin:0;padding-left:19px}
.summary li{font-size:13.5px;line-height:1.6;margin-bottom:9px;color:#3E4653}
.summary li:last-child{margin-bottom:0}
.summary li b{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px}
.kpi{background:var(--paper);border:1px solid var(--hair);border-radius:12px;padding:15px 16px}
.kpi b{display:block;font-size:28px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted);display:block;margin-top:3px}
.kpi em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--brand)}
.kpi em.down{color:#B0405C}
h2.sec{font-size:17px;letter-spacing:-.015em;margin:30px 0 6px}
p.note{font-size:13px;color:var(--muted);margin:0 0 12px;max-width:72ch}
.box2{background:var(--paper);border:1px solid var(--hair);border-radius:13px;padding:6px 18px 14px}
.frow{display:grid;grid-template-columns:196px 1fr 74px 62px 66px;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #EEF0F3;font-size:13px}
.frow:last-child{border-bottom:none}
.frow.head{padding:11px 0 8px;border-bottom:1px solid var(--hair);font-size:11.5px;color:var(--muted);font-weight:600}
.frow h3{font-size:13.5px;margin:0;font-weight:600}
.frow small{display:block;color:var(--muted);font-weight:400;font-size:11.5px;margin-top:1px}
.trackbar{height:10px;background:#EDEFF3;border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--brand);border-radius:5px;transition:width .7s cubic-bezier(.2,.7,.3,1)}
.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.dim{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:400}
.leak{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:#B0405C}
.leak.zero{color:var(--muted);font-weight:400}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mix{display:flex;height:32px;border-radius:8px;overflow:hidden;margin:2px 0 14px}
.mix div{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;color:#fff}
.legend{display:flex;flex-direction:column;gap:11px}
.lrow{display:grid;grid-template-columns:12px 1fr auto 54px;gap:10px;align-items:start;font-size:13px}
.lrow i{width:11px;height:11px;border-radius:3px;display:block;margin-top:4px}
.lrow b{font-variant-numeric:tabular-nums}
.lrow span.conv{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.lrow em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.callout{border-left:3px solid #B0405C;background:#FBEDF0;border-radius:0 10px 10px 0;padding:14px 16px;margin-top:14px}
.callout h3{margin:0 0 4px;font-size:14px}
.callout p{margin:0;font-size:13px;color:#6B4550;line-height:1.5}
.lat{display:flex;gap:24px;flex-wrap:wrap;margin-top:16px}
.lat div b{display:block;font-size:21px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.lat div span{font-size:12px;color:var(--muted)}
table.pct{width:100%;border-collapse:collapse;font-size:13px}
table.pct th{text-align:right;font-size:11.5px;color:var(--muted);font-weight:600;padding:11px 0 8px;border-bottom:1px solid var(--hair)}
table.pct th:first-child{text-align:left}
table.pct td{padding:11px 0;border-bottom:1px solid #EEF0F3;text-align:right;font-variant-numeric:tabular-nums}
table.pct td:first-child{text-align:left}
table.pct tr:last-child td{border-bottom:none}
table.pct td.med{font-weight:700}
table.pct td small{display:block;color:var(--muted);font-weight:400;font-size:11.5px;margin-top:1px}
.foot{font-size:12.5px;color:var(--muted);margin-top:24px}
@media (max-width:860px){.split{grid-template-columns:1fr}.frow{grid-template-columns:130px 1fr 60px 50px 56px;font-size:12px}}

/* time slots on the provider profile */
.slotrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:9px}
.dayrow{display:flex;align-items:center;gap:8px;margin:0 0 5px}
.dayrow p{font-size:11px;font-weight:700;color:var(--ink);margin:0;white-space:nowrap}
.dayrow span{flex:1;height:1px;background:#EEF0F3}
.tchip{font-size:11.5px;font-weight:600;text-align:center;padding:8px 4px;border:1px solid var(--hair);
  border-radius:10px;background:var(--paper);transition:background .22s ease,border-color .22s ease,color .22s ease}
.tchip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.slotlab{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#98A0AD;margin:0 0 6px}

/* the verification moment */
.verify{padding:0 4px}
.vring{width:70px;height:70px;border-radius:50%;margin:0 auto 20px;position:relative;
  background:conic-gradient(var(--brand) 0turn, #E9ECEF 0turn);animation:sweep 2.6s cubic-bezier(.4,0,.5,1) forwards}
@keyframes sweep{to{background:conic-gradient(var(--brand) 1turn, #E9ECEF 1turn)}}
.vring::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--paper)}
.vring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--brand);z-index:2}
.vlist{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.vitem{display:flex;align-items:center;gap:10px;font-size:13.5px;color:#A8B0BC;transition:color .3s ease}
.vitem .dotv{width:18px;height:18px;border-radius:50%;border:2px solid #DDE1E7;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:10px;color:#fff;transition:background .3s ease,border-color .3s ease}
.vitem.done{color:var(--ink);font-weight:600}
.vitem.done .dotv{background:var(--brand);border-color:var(--brand)}

/* combined confirm page */
.seclab{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#98A0AD;margin:0 0 6px}
.cost{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-radius:12px;
  background:var(--brand-soft);margin-bottom:11px}
.cost span{font-size:12.5px;font-weight:600;color:var(--brand)}
.cost b{font-size:23px;letter-spacing:-.02em;color:var(--brand)}

/* centred booking summary behind the pay sheet */
.bookcard{border:1px solid var(--hair);border-radius:18px;padding:20px 18px 16px;text-align:center;
  box-shadow:0 10px 30px -22px rgba(16,20,28,.4)}
.bkav{width:52px;height:52px;border-radius:50%;background:var(--brand);color:#fff;font-weight:600;font-size:16px;
  display:flex;align-items:center;justify-content:center;margin:0 auto 11px}
.bookcard h3{margin:0;font-size:17.5px;letter-spacing:-.015em}
.bookcard p{margin:3px 0 14px;font-size:12.5px;color:var(--muted)}
.bkwhen{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 0;border-top:1px solid #EEF0F3;border-bottom:1px solid #EEF0F3}
.bkwhen span{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#98A0AD;margin-bottom:2px}
.bkwhen b{font-size:15px;letter-spacing:-.01em}
.bkamt{display:flex;justify-content:space-between;align-items:baseline;padding-top:13px}
.bkamt span{font-size:12.5px;color:var(--muted)}
.bkamt b{font-size:26px;letter-spacing:-.025em;color:var(--brand)}

/* consent checkbox beside the terms */
.consent{display:flex;gap:9px;align-items:flex-start;margin-top:11px}
.cbox{width:17px;height:17px;border-radius:4px;border:1.5px solid var(--hair);background:var(--paper);flex:none;
  margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;
  transition:background .22s ease,border-color .22s ease}
.cbox.on{background:var(--brand);border-color:var(--brand)}
.consent .legal{margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* typed fields */
.typed{font-size:20px;letter-spacing:.04em;padding:14px;border:1.5px solid var(--brand);border-radius:11px;
  font-variant-numeric:tabular-nums;min-height:52px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.typed.empty{border-color:var(--hair);color:#A8B0BC}
.caret{display:inline-block;width:2px;height:20px;background:var(--brand);margin-left:2px;animation:cb .9s steps(1) infinite;vertical-align:-3px}
@keyframes cb{50%{opacity:0}}
.otpbox{display:flex;gap:6px;margin-bottom:10px}
.otpbox i{flex:1;height:50px;border:1.5px solid var(--hair);border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:600;font-style:normal;font-variant-numeric:tabular-nums}
.otpbox i.on{border-color:var(--brand)}
.sms{background:#F1F2F5;border-radius:12px;padding:10px 12px;font-size:12px;margin-bottom:10px}
.sms b{display:block;font-size:10.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
.hintline{font-size:11.5px;color:var(--muted);margin:0 0 10px}
/* dropdown filters */
.selrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:12px;position:relative;z-index:5}
.sel{position:relative;border:1px solid var(--hair);border-radius:10px;padding:7px 9px;background:#fff;cursor:default}
.sel .lab{font-size:8.5px;text-transform:uppercase;letter-spacing:.07em;color:#98A0AD;font-weight:700;display:block;margin-bottom:1px}
.sel .val{font-size:11.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:4px;white-space:nowrap}
.sel .val i{font-style:normal;font-size:8px;color:#98A0AD}
.sel.set{border-color:var(--brand);background:var(--brand-soft)}
.sel.set .val{color:var(--brand)}
.sel.open{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,107,87,.12)}
.selmenu{position:absolute;top:calc(100% + 5px);left:0;min-width:100%;background:#fff;border:1px solid var(--hair);
  border-radius:10px;box-shadow:0 12px 28px rgba(0,0,0,.16);z-index:9;overflow:hidden;animation:menuIn .17s ease-out}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.selmenu div{padding:8px 11px;font-size:11.5px;white-space:nowrap;border-bottom:1px solid #F2F3F6}
.selmenu div:last-child{border-bottom:none}
.selmenu div.hot{background:var(--brand-soft);color:var(--brand);font-weight:600}
/* collapsing list */
.prov{overflow:hidden;transition:max-height .38s cubic-bezier(.4,0,.2,1),opacity .2s ease,margin .38s cubic-bezier(.4,0,.2,1),padding .38s cubic-bezier(.4,0,.2,1),border-width .3s ease;max-height:110px}
.prov.gone{max-height:0;opacity:0;margin-bottom:0;padding-top:0;padding-bottom:0;border-width:0}
.resultline{transition:color .2s ease}
</style>
</head>

const provHTML=p=>`<div class="prov" data-k="${p.k}" ${p.k==='ao'?'id="pick"':''}><div class="av">${p.i}</div><div>

function searchScreen(){
  return `
  <h2 class="t">Find care</h2>

}
const MENUS={
  selDist:{opts:["Any","Within 5 mi","Within 10 mi","Within 25 mi"],pick:"Within 10 mi",target:"vDist"},
  selFmt:{opts:["Any","Video","In person"],pick:"In person",target:"vFmt"},
  selSpec:{opts:["Any","Anxiety","Depression","ADHD","Trauma","Couples","OCD","Grief"],pick:"Anxiety",target:"vSpec"}
};
function openMenu(id){
  const host=scr.querySelector('#'+id); if(!host) return;
  host.classList.add('open');
  const m=MENUS[id];
  const el=document.createElement('div');
  el.className='selmenu';
  el.innerHTML=m.opts.map(o=>`<div class="${o===m.pick?'hot':''}">${o}</div>`).join("");
  host.appendChild(el);
}
function chooseMenu(id){
  const host=scr.querySelector('#'+id); if(!host) return;
  const m=MENUS[id];
  host.classList.remove('open'); host.classList.add('set');
  const menu=host.querySelector('.selmenu'); if(menu) menu.remove();
  const v=scr.querySelector('#'+m.target);
  if(v) v.innerHTML=`${m.pick} <i>\u25BC</i>`;
  applyFilters();
}
function applyFilters(){
  const dist=(scr.querySelector('#vDist')||{}).textContent||"";
  const fmt=(scr.querySelector('#vFmt')||{}).textContent||"";
  const spec=(scr.querySelector('#vSpec')||{}).textContent||"";
  let n=0;
  ALL.forEach(p=>{
    let ok=true;
    if(dist.includes("10 mi") && p.mi>10) ok=false;
    if(fmt.includes("In person") && p.fmt!=="person") ok=false;
    if(spec.includes("Anxiety") && !p.spec.includes("anx")) ok=false;
    const row=scr.querySelector(`[data-k="${p.k}"]`);
    if(row) row.classList.toggle('gone',!ok);
    if(ok) n++;
  });
  const r=scr.querySelector('#rline');
  if(r){
    const parts=[];
    if(spec.includes("Anxiety")) parts.push("anxiety");
    if(fmt.includes("In person")) parts.push("in person");
    if(dist.includes("10 mi")) parts.push("within 10 mi");
    r.textContent = parts.length ? `${n} match${n===1?"":"es"} \u00B7 ${parts.join(" \u00B7 ")}`
                                 : `${n===ALL.length?38:n} clinicians near Dallas, TX`;
  }
}

      {at:2950, fn:()=>{ const b=scr.querySelector('#cbox'); if(b){ b.classList.add('on'); b.textContent='\u2713'; } }}
    ],
    render(){ return `
      <div class="prohead"><div class="av">AO</div>
        <div><h3>Dr. Amara Osei</h3><p>PsyD, Licensed Clinical Psychologist</p>
        <div class="stars">\u2605 4.9 \u00B7 212 reviews \u00B7 2.1 mi</div></div></div>
      <p class="bio">Anxiety, panic and burnout in adults. Cognitive behavioural therapy, structured rather than open-ended.</p>
      <p class="slotlab">Choose a time</p>

        <div class="tchip">1:45 PM</div>

      </div>
      <div class="grow"></div>
      <div class="consent">
        <div class="cbox" id="cbox"></div>
        <p class="legal"><b>I authorize my wireless carrier to share my mobile number, name, address and device details with Northwood Health to confirm my identity, and I authorize Northwood Health to recover my demographic information and check my insurance eligibility.</b> I agree to the <u>Terms</u>, <u>Privacy Policy</u> and <u>HIPAA Notice</u>.</p>
      </div>
      <div class="btn" id="sched" style="margin-top:12px">Schedule My Appointment</div>`; } },

  { tip:"Nirvana confirms user's identity and recovers active insurance details.",
    hold:4600,
    seq:[
      {at:1200, fn:()=>{ const e=scr.querySelector('#v1'); if(e){e.classList.add('done'); e.querySelector('.dotv').textContent='\u2713';} }},
      {at:2700, fn:()=>{ const e=scr.querySelector('#v2'); if(e){e.classList.add('done'); e.querySelector('.dotv').textContent='\u2713';} }}
    ],
    render(){ return `

  { hold:3600, last:true,
    render(){ return `

        <p class="s">Thursday, September 3 at 10:30 AM with Dr. Amara Osei.<br>1820 Cedar Springs Rd, Suite 210, Dallas TX.<br>We texted you the details.</p></div>
      <div class="grow"></div>`; } }
];

const dots=document.getElementById('dots');
dots.innerHTML=STEPS.map(()=>'<i></i>').join("");
function clearAllTimers(){
  [tapTimers,typeTimers,seqTimers].forEach(a=>{a.forEach(t=>clearTimeout(t));a.length=0;});
}

function paint(){
  clearTimeout(timer); clearTimeout(tipTimer); clearAllTimers();
  vp.querySelectorAll('.tapdot,.tip').forEach(n=>n.remove());
  const st=STEPS[i];
  chromeEl.style.display = st.chrome===false ? "none" : "block";
  scr.style.padding = st.chrome===false ? "0" : "6px 20px 20px";
  scr.innerHTML=st.render();
  scr.classList.remove('in-fwd','in-back','in-fade');
  void scr.offsetWidth;
  scr.classList.add(transDir>0?'in-fwd':transDir<0?'in-back':'in-fade');
  transDir=0;
  document.getElementById('capn').textContent=`Step ${i+1} of ${STEPS.length}`;
  [...dots.children].forEach((d,n)=>d.classList.toggle('on',n===i));
  document.getElementById('back').disabled=i===0;
  if(st.tip) tipTimer=setTimeout(()=>showTip(st.tip),260);
  if(playing){
    (st.taps||[]).forEach(t=>tapTimers.push(setTimeout(()=>showTap(t.sel),t.at)));
    (st.seq||[]).forEach(a=>seqTimers.push(setTimeout(a.fn,a.at)));
    if(st.type) runType(st.type);
    timer=setTimeout(nextStep, st.hold);
  } else {
    if(st.type){ const el=scr.querySelector(st.type.sel); if(el){ el.classList.remove('empty'); el.textContent=st.type.text; } }
    (st.seq||[]).forEach(a=>a.fn());
  }
}
function runType(cfg){
  const el=scr.querySelector(cfg.sel); if(!el) return;
  const chars=cfg.text.split("");
  el.textContent=""; el.classList.remove('empty');
  chars.forEach((c,n)=>{
    typeTimers.push(setTimeout(()=>{
      el.innerHTML=cfg.text.slice(0,n+1)+'<span class="caret"></span>';
      if(n===chars.length-1) typeTimers.push(setTimeout(()=>{el.textContent=cfg.text;},380));
    }, (cfg.start||600)+n*(cfg.speed||70)));
  });
}
function showTap(sel){
  const el=scr.querySelector(sel); if(!el) return;
  const r=el.getBoundingClientRect(), v=vp.getBoundingClientRect();
  const d=document.createElement('div');
  d.className='tapdot';
  d.style.left=(r.left-v.left+r.width/2)+'px';
  d.style.top=(r.top-v.top+r.height/2)+'px';
  d.innerHTML=`<i></i>`;
  vp.appendChild(d);
  setTimeout(()=>d.remove(),1250);
}
function showTip(text){
  const v=vp.getBoundingClientRect();
  const zone = scr.querySelector('.tipzone') || scr.querySelector('.grow');
  const t=document.createElement('div');
  t.className='tip'; t.textContent=text;
  t.style.maxWidth=(v.width-36)+'px';
  vp.appendChild(t);
  const h=t.offsetHeight, w=t.offsetWidth;
  let top;
  if(zone){
    const z=zone.getBoundingClientRect();
    const zTop=z.top-v.top, zH=z.height;
    top = zH>=h+16 ? zTop+(zH-h)/2 : Math.max(60, zTop+zH-h-6);
  } else { top = v.height-h-84; }
  t.style.top=Math.min(Math.max(56,top), v.height-h-14)+'px';
  t.style.left=Math.round((v.width-w)/2)+'px';
}
let transDir=0;
function makeGhost(dir){
  const g=document.createElement('div');
  g.className='ghost '+(dir<0?'out-back':'out-fwd');
  const cs=getComputedStyle(scr);
  g.style.top=scr.offsetTop+'px';
  g.style.left=scr.offsetLeft+'px';
  g.style.width=scr.offsetWidth+'px';
  g.style.height=scr.offsetHeight+'px';
  g.style.padding=cs.padding;
  g.innerHTML=scr.innerHTML;
  vp.appendChild(g);
  setTimeout(()=>g.remove(),440);
}
function go(n){
  if(n===i){ paint(); return; }
  const sameScreen = STEPS[n].key && STEPS[n].key===STEPS[i].key;
  clearTimeout(timer); clearTimeout(tipTimer); clearAllTimers();
  if(sameScreen){
    vp.querySelectorAll('.tip').forEach(t=>{t.classList.add('out');setTimeout(()=>t.remove(),210);});
    i=n; paintInPlace();
    return;
  }
  vp.querySelectorAll('.tip,.tapdot').forEach(t=>{t.style.transition='opacity .16s ease';t.style.opacity=0;setTimeout(()=>t.remove(),180);});
  const dir = n>i ? 1 : -1;
  makeGhost(dir);
  transDir=dir;
  const chromeWasHidden = STEPS[i].chrome===false;
  i=n; paint();
  if(chromeWasHidden !== (STEPS[i].chrome===false)){
    chromeEl.style.opacity=0;
    requestAnimationFrame(()=>{ chromeEl.style.opacity=1; });
  }
}
/* same underlying screen: keep the DOM, just re-arm timers and tooltip */
function paintInPlace(){
  const st=STEPS[i];
  document.getElementById('capn').textContent=`Step ${i+1} of ${STEPS.length}`;
  [...dots.children].forEach((d,n)=>d.classList.toggle('on',n===i));
  document.getElementById('back').disabled=i===0;
  if(st.tip) tipTimer=setTimeout(()=>showTip(st.tip),260);
  if(playing){
    (st.taps||[]).forEach(t=>tapTimers.push(setTimeout(()=>showTap(t.sel),t.at)));
    (st.seq||[]).forEach(a=>seqTimers.push(setTimeout(a.fn,a.at)));
    timer=setTimeout(nextStep, st.hold);
  } else { (st.seq||[]).forEach(a=>a.fn()); }
}
function nextStep(){ if(i<STEPS.length-1){ go(i+1); } else { playing=false; syncPlay(); } }
function syncPlay(){ document.getElementById('play').textContent = playing?"Pause":"Play"; }

document.getElementById('play').onclick=()=>{
  if(!playing && i===STEPS.length-1){ playing=true; syncPlay(); i=0; paint(); return; }
  playing=!playing; syncPlay(); paint();
};
document.getElementById('next').onclick=()=>{ playing=false; syncPlay(); if(i<STEPS.length-1) go(i+1); };
document.getElementById('back').onclick=()=>{ playing=false; syncPlay(); if(i>0) go(i-1); };
document.getElementById('restart').onclick=()=>{ playing=true; syncPlay(); i=0; paint(); };




syncPlay();
paint();
</script>
